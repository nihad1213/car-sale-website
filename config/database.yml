default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "ror_car_sale_development") %>

test:
  <<: *default
  database: ror_car_sale_test

production:
  primary: &primary_production
    <<: *default
    database: ror_car_sale_production
    username: ror_car_sale
    password: <%= ENV["ror_car_sale_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: ror_car_sale_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: ror_car_sale_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: ror_car_sale_production_cable
    migrations_paths: db/cable_migrate